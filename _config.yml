title: Izhar Ahmad | Blog
description: > # this means to ignore newlines until "baseurl:"
  Hi, I'm Izhar and this is my personal blog. I write on the topics of tech and programming.
permalink: ':title/'
baseurl: "/flexible-jekyll" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com
site-twitter: #if your site has a twitter account, enter it here

# Author Settings
author: Izhar Ahmad # add your name
author-img: izhar.jpg # add your photo
about-author: "I'm Izhar, an avid programmer and computer science student. I mostly write on the topics of programming and tech (while occasionally discussing some other things) on this blog." # add description
social-twitter: # add your Twitter handle
social-facebook: # add your Facebook handle
social-github: izxxr # add your Github handle
social-linkedin: thisizahmad # add your Linkedin handle
social-email: thatizharahmad@gmail.com # add your Email address

# Disqus
discus-identifier: "" # add your discus identifier

# Tracker
analytics: # Google Analytics

# Build Settings
markdown: kramdown
plugins:
  - jekyll-sitemap
  - jekyll-paginate
  - jemoji

paginate: 8
paginate_path: "/page/:num"

exclude: ["node_modules", "gulpfile.js", "package.json", "yarn.lock"]
